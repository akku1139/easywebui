name: Deploy

on:
  push:
    branches: [ai-chat-web-ui-development-7ac5e]
  workflow_dispatch:

# Never run two migration/deployment sequences against the same D1 database.
concurrency:
  group: production-d1-deploy
  cancel-in-progress: false

jobs:
  build:
    name: Type Check, Test & Build
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - uses: pnpm/setup@v1
        with:
          version: 11
          runtime: node@24
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check and test
        run: pnpm run typecheck && pnpm run test:run

      - name: Build frontend with Pages Functions
        run: pnpm run build:main

      - name: Generate wrangler.toml from template
        run: |
          sed -e "s|{{D1_DATABASE_ID}}|${{ secrets.D1_DATABASE_ID }}|g" \
              -e "s|{{OPENAI_BASE_URL}}|${{ secrets.OPENAI_BASE_URL }}|g" \
              wrangler.toml.template > wrangler.toml
          echo "Generated wrangler.toml:"
          cat wrangler.toml

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            dist/
            functions/
            drizzle/
            wrangler.toml
          retention-days: 1

  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    needs: build
    environment: production
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: .

      - uses: pnpm/setup@v1
        with:
          version: 11
          runtime: node@24
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Wrangler
        run: |
          npm install --global --prefix "$RUNNER_TEMP/wrangler" wrangler@4.133.0
          echo "$RUNNER_TEMP/wrangler/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/wrangler/bin/wrangler" --version

      - name: Apply database migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
        run: pnpm run db:migrate:prod

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Set secrets for Pages Functions (use echo -n to avoid trailing newline)
          echo -n "${{ secrets.BASIC_AUTH_USER }}" | wrangler pages secret put BASIC_AUTH_USER --project-name ai-chat
          echo -n "${{ secrets.BASIC_AUTH_PASS }}" | wrangler pages secret put BASIC_AUTH_PASS --project-name ai-chat
          echo -n "${{ secrets.OPENAI_API_KEY }}" | wrangler pages secret put OPENAI_API_KEY --project-name ai-chat
          
          # Deploy Pages with Functions
          wrangler pages deploy dist --project-name ai-chat
