name: Deploy

on:
  push:
    branches: [ai-chat-web-ui-development-7ac5e]
  workflow_dispatch:

jobs:
  build:
    name: Type Check, Test & Build
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend with Pages Functions
        run: npm run build

      - name: Generate wrangler.toml from template
        run: |
          sed -e "s|{{D1_DATABASE_ID}}|${{ secrets.D1_DATABASE_ID }}|g" \
              -e "s|{{OPENAI_BASE_URL}}|${{ secrets.OPENAI_BASE_URL }}|g" \
              wrangler.toml.template > wrangler.toml
          echo "Generated wrangler.toml:"
          cat wrangler.toml

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            dist/
            functions/
            wrangler.toml
          retention-days: 1

  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    needs: build
    environment: production
    
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: .

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Run database migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Run Drizzle migrations on D1
          wrangler d1 execute ai-chat-db --remote --file=./drizzle/0000_initial_schema.sql

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Set secrets for Pages Functions
          wrangler pages secret put BASIC_AUTH_USER --project-name ai-chat <<< "${{ secrets.BASIC_AUTH_USER }}"
          wrangler pages secret put BASIC_AUTH_PASS --project-name ai-chat <<< "${{ secrets.BASIC_AUTH_PASS }}"
          wrangler pages secret put OPENAI_API_KEY --project-name ai-chat <<< "${{ secrets.OPENAI_API_KEY }}"
          
          # Deploy Pages with Functions
          wrangler pages deploy dist --project-name ai-chat
